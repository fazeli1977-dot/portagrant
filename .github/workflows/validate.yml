name: Validate PortaGrant

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/portagrant
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo rustc --lib --locked --release --target wasm32-unknown-unknown --no-default-features --crate-type=cdylib
      - uses: actions/upload-artifact@v4
        with:
          name: portagrant-wasm
          path: contracts/portagrant/target/wasm32-unknown-unknown/release/portagrant.wasm
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check frontend/app.js
      - run: node --check scripts/deploy.mjs
      - run: node --check scripts/inspect.mjs
      - run: node --check scripts/inspect-grant.mjs
      - run: npm ci --ignore-scripts
        working-directory: scripts
      - run: npm test --prefix scripts
      - run: node --check scripts/deploy-transaction.mjs
      - run: node scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: portagrant-demo
          path: |
            frontend/index.html
            frontend/app.js
            frontend/styles.css
          if-no-files-found: error
